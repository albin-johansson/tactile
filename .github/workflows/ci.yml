name: "CI"

on:
  - "push"

jobs:
  macos-build-and-test:
    runs-on: "macos-26"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Generate build files"
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG         \
                   -GNinja                   \
                   -DTACTILE_ENABLE_TESTS=ON \
                   -DTACTILE_ENABLE_UBSAN=ON

      - name: "Build"
        working-directory: "./build"
        run: |
          ninja

      - name: "Test"
        working-directory: "./build"
        run: |
          ./tactile_tests

  ubuntu-build-and-test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      # https://github.com/libsdl-org/SDL/blob/main/docs/README-linux.md
      - name: "Install build dependencies for SDL"
        run: |
          sudo apt install build-essential       \
                           git                   \
                           make                  \
                           pkg-config            \
                           cmake                 \
                           ninja-build           \
                           gnome-desktop-testing \
                           libasound2-dev        \
                           libpulse-dev          \
                           libaudio-dev          \
                           libfribidi-dev        \
                           libjack-dev           \
                           libsndio-dev          \
                           libx11-dev            \
                           libxext-dev           \
                           libxrandr-dev         \
                           libxcursor-dev        \
                           libxfixes-dev         \
                           libxi-dev             \
                           libxss-dev            \
                           libxtst-dev           \
                           libxkbcommon-dev      \
                           libdrm-dev            \
                           libgbm-dev            \
                           libgl1-mesa-dev       \
                           libgles2-mesa-dev     \
                           libegl1-mesa-dev      \
                           libdbus-1-dev         \ 
                           libibus-1.0-dev       \
                           libudev-dev

      - name: "Generate build files"
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG         \
                   -GNinja                   \
                   -DTACTILE_ENABLE_TESTS=ON \
                   -DTACTILE_ENABLE_UBSAN=ON

      - name: "Build"
        working-directory: "./build"
        run: |
          ninja

      - name: "Test"
        working-directory: "./build"
        run: |
          ./tactile_tests
