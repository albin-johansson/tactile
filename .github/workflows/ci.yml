name: "CI"

on:
  - push

jobs:
  macos-build-and-test:
    runs-on: macos-15
    env:
      VCPKG_TARGET_TRIPLET: arm64-osx-tactile
      VCPKG_DEFAULT_TRIPLET: arm64-osx-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app

      - name: Install system dependencies
        run: |
          brew install llvm
          brew install ninja
          brew install autoconf
          brew install automake
          brew install libtool

      - name: Install Vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install assets
        working-directory: ./scripts
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        env:
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang++
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG \
                   -GNinja \
                   -DCMAKE_BUILD_TYPE=Debug \
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} \
                   -DTACTILE_BUILD_TESTS=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run 'tactile' module tests
        working-directory: ./build/debug
        run: ./tactile_tests

  ubuntu-build-and-test:
    runs-on: ubuntu-24.04
    env:
      VCPKG_TARGET_TRIPLET: x64-linux-tactile
      VCPKG_DEFAULT_TRIPLET: x64-linux-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install ninja-build \
                           mold \
                           autoconf \
                           automake \
                           libtool \
                           libltdl-dev \
                           libx11-dev \
                           libxft-dev \
                           libxext-dev \
                           libwayland-dev \
                           libxkbcommon-dev \
                           libegl1-mesa-dev \
                           libibus-1.0-dev

      - name: Use GCC 14
        run: sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14

      - name: Install Vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install custom Vcpkg triplet file
        working-directory: ./scripts
        run: python3 add_vcpkg_triplet.py

      - name: Install assets
        working-directory: ./scripts
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG \
                   -GNinja \
                   -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" \
                   -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" \
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} \
                   -DTACTILE_BUILD_TESTS=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run 'tactile' module tests
        working-directory: ./build/debug
        run: ./tactile_tests

  windows-build-and-test:
    runs-on: windows-2025
    env:
      VCPKG_TARGET_TRIPLET: x64-windows-tactile
      VCPKG_DEFAULT_TRIPLET: x64-windows-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Install Vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install custom Vcpkg triplet file
        working-directory: ./scripts
        run: python3 add_vcpkg_triplet.py

      - name: Install assets
        working-directory: ./scripts
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG `
                   -GNinja `
                   -DCMAKE_BUILD_TYPE=Debug `
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} `
                   -DTACTILE_BUILD_TESTS=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run 'tactile' module tests
        working-directory: ./build/debug
        shell: cmd
        run: tactile_tests.exe
