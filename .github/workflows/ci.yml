name: CI

on:
  - push

env:
  VCPKG_ROOT: ${{github.workspace}}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg/bincache
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  macos-build-and-test:
    runs-on: macos-15
    permissions:
      contents: read
    env:
      VCPKG_TARGET_TRIPLET: arm64-osx-tactile
      VCPKG_DEFAULT_TRIPLET: arm64-osx-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app

      - name: Install system dependencies
        run: |
          brew install llvm
          brew install ninja
          brew install autoconf
          brew install automake
          brew install libtool

      - name: Restore cached Vcpkg
        id: restore-cached-vcpkg
        uses: actions/cache@v4
        with:
          key: tactile-ci-macos-vcpkg-${{hashFiles('vcpkg.json')}}
          path: |
            ${{env.VCPKG_ROOT}}
            !${{env.VCPKG_ROOT}}/buildtrees
            !${{env.VCPKG_ROOT}}/packages
            !${{env.VCPKG_ROOT}}/downloads
            !${{env.VCPKG_ROOT}}/installed

      - name: Install Vcpkg
        if: steps.restore-cached-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Create Vcpkg binary cache directory
        run: mkdir -p $VCPKG_DEFAULT_BINARY_CACHE

      - name: Patch libc++.modules.json
        working-directory: ./tools
        run: patch /opt/homebrew/share/cmake/Modules/Compiler/Clang-CXX-CXXImportStd.cmake < homebrew-llvm-fix-libc++-modules-path.diff

      - name: Install assets
        working-directory: ./tools
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG \
                   -GNinja \
                   -DCMAKE_TOOLCHAIN_FILE=tools/vcpkg/toolchains/vcpkg-clang.cmake \
                   -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_OSX_SYSROOT=macosx \
                   -DCMAKE_EXPERIMENTAL_CXX_IMPORT_STD=0e5b6991-d74f-4b3d-a41c-cf096e0b2508 \
                   -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                   -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} \
                   -DTACTILE_ENABLE_TESTS=ON \
                   -DTACTILE_ENABLE_EDITOR=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run core tests
        working-directory: ./build/debug
        run: ./tactile_core_tests

      - name: Run editor tests
        working-directory: ./build/debug
        run: ./tactile_editor_tests

      - name: Run clang-tidy and clang-format
        uses: cpp-linter/cpp-linter-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 19
          database: build/debug
          ignore: build|tools|vcpkg
          extensions: .cpp,.cppm
          style: file
          tidy-checks: ""
          thread-comments: false
          file-annotations: false
          tidy-review: false
          format-review: false
          step-summary: true
          lines-changed-only: false
          files-changed-only: false

  ubuntu-build-and-test:
    if: false
    runs-on: ubuntu-24.04
    env:
      VCPKG_TARGET_TRIPLET: x64-linux-tactile
      VCPKG_DEFAULT_TRIPLET: x64-linux-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install ninja-build \
                           mold \
                           autoconf \
                           automake \
                           clang \
                           libtool \
                           libltdl-dev \
                           libx11-dev \
                           libxft-dev \
                           libxext-dev \
                           libwayland-dev \
                           libxkbcommon-dev \
                           libegl1-mesa-dev \
                           libibus-1.0-dev

      - name: Use GCC 14
        run: sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14

      - name: Restore cached Vcpkg
        id: restore-cached-vcpkg
        uses: actions/cache@v4
        with:
          key: tactile-ci-ubuntu-vcpkg-${{hashFiles('vcpkg.json')}}
          path: |
            ${{env.VCPKG_ROOT}}
            !${{env.VCPKG_ROOT}}/buildtrees
            !${{env.VCPKG_ROOT}}/packages
            !${{env.VCPKG_ROOT}}/downloads
            !${{env.VCPKG_ROOT}}/installed

      - name: Install Vcpkg
        if: steps.restore-cached-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Create Vcpkg binary cache directory
        run: mkdir -p $VCPKG_DEFAULT_BINARY_CACHE

      - name: Install assets
        working-directory: ./tools
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG \
                   -GNinja \
                   -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" \
                   -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" \
                   -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} \
                   -DTACTILE_ENABLE_TESTS=ON \
                   -DTACTILE_ENABLE_EDITOR=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run core tests
        working-directory: ./build/debug
        run: ./tactile_core_tests

      - name: Run editor tests
        working-directory: ./build/debug
        run: ./tactile_editor_tests

  windows-build-and-test:
    runs-on: windows-2025
    env:
      VCPKG_TARGET_TRIPLET: x64-windows-tactile
      VCPKG_DEFAULT_TRIPLET: x64-windows-tactile
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Restore cached Vcpkg
        id: restore-cached-vcpkg
        uses: actions/cache@v4
        with:
          key: tactile-ci-windows-vcpkg-${{hashFiles('vcpkg.json')}}
          path: |
            ${{env.VCPKG_ROOT}}
            !${{env.VCPKG_ROOT}}\buildtrees
            !${{env.VCPKG_ROOT}}\packages
            !${{env.VCPKG_ROOT}}\downloads
            !${{env.VCPKG_ROOT}}\installed

      - name: Install Vcpkg
        if: steps.restore-cached-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg integrate install

      - name: Create Vcpkg binary cache directory
        run: mkdir -p $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Install assets
        working-directory: ./tools
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG `
                   -GNinja `
                   -DCMAKE_BUILD_TYPE=Debug `
                   -DCMAKE_EXPERIMENTAL_CXX_IMPORT_STD=0e5b6991-d74f-4b3d-a41c-cf096e0b2508 `
                   -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} `
                   -DTACTILE_ENABLE_TESTS=ON `
                   -DTACTILE_ENABLE_EDITOR=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run core tests
        working-directory: ./build/debug
        shell: cmd
        run: tactile_core_tests.exe

      - name: Run editor tests
        working-directory: ./build/debug
        shell: cmd
        run: tactile_editor_tests.exe
