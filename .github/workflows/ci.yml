name: "CI"

on:
  - push

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  macos-build-and-test:
    runs-on: macos-15
    env:
      VCPKG_ROOT: ${{github.workspace}}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}/vcpkg/bincache
      VCPKG_TARGET_TRIPLET: arm64-osx-tactile
    steps:
      - uses: actions/checkout@v4

      # https://learn.microsoft.com/en-us/vcpkg/consume/binary-caching-github-actions-cache
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_16.3.app

      - name: Install system dependencies
        run: |
          brew install llvm
          brew install ninja
          brew install autoconf
          brew install automake
          brew install libtool    

      - name: Install Vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Create Vcpkg binary cache directory
        run: mkdir -p ${{env.VCPKG_DEFAULT_BINARY_CACHE}}

      - name: Install custom Vcpkg triplet file
        working-directory: ./scripts
        run: python3 add_vcpkg_triplet.py

      - name: Install assets
        working-directory: ./scripts
        run: python3 install_assets.py --skip-fonts

      - name: Generate build files
        env:
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang++
        run: |
          mkdir build
          cd build
          cmake .. --log-level=DEBUG \
                   -GNinja \
                   -DCMAKE_BUILD_TYPE=Debug \
                   -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}} \
                   -DTACTILE_BUILD_TESTS=ON

      - name: Build
        run: ninja -C build

      - name: Install
        run: ninja -C build install

      - name: Run 'tactile' module tests
        working-directory: ./build/debug
        run: ./tactile_tests
